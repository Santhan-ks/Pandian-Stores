services:
  db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nova
    ports:
      - "127.0.0.1:${NOVA_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://nova:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nova
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret in .env}
      NOVA_ALLOW_DEMO_INVOICES: ${NOVA_ALLOW_DEMO_INVOICES:-false}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${NOVA_APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 7s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
