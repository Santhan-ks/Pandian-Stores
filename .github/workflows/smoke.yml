name: Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardened-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run production:init
      - run: npm run production:up -- --bootstrap
      - run: npm run production:verify
      - run: npm run production:recovery-drill
      - name: Stop the isolated rehearsal
        if: always()
        run: npm run production:stop

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nova:local_ci_password@localhost:5432/nova_test
      NOVA_ALLOW_DEMO_SEED: "true"
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate isolated test credentials
        run: |
          echo "DEMO_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run db:migrate:test
      - run: npm run verify:system
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:seed:test
      - run: npm run db:seed:test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser workflows sequentially
        run: |
          for browser in chromium firefox webkit; do
            npm run test:e2e -- --browser="$browser"
            npm run test:review -- --browser="$browser"
            npm run test:cross -- --browser="$browser"
          done
      - name: Check HTTP health
        env:
          DATABASE_URL: postgresql://nova:local_ci_password@localhost:5432/nova_test
        run: |
          npm run start > /tmp/nova-next.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 http://localhost:3000/api/health | jq -e '.status == "ok"'
          npm run test:smoke
